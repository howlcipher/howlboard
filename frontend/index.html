<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HowlBoard | App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div>
                <p class="kicker">// full-stack howlframe dogfood / deterministic task state</p>
                <h1>HowlBoard</h1>
            </div>
            <div>
                <button id="theme-toggle">Toggle Theme</button>
            </div>
        </header>

        <div id="error" class="error"></div>

        <div class="filters">
            <input type="text" id="filter-search" placeholder="Search tasks..." />
            <select id="filter-status">
                <option value="">All Statuses</option>
                <option value="BACKLOG">BACKLOG</option>
                <option value="READY">READY</option>
                <option value="IN_PROGRESS">IN_PROGRESS</option>
                <option value="BLOCKED">BLOCKED</option>
                <option value="DONE">DONE</option>
            </select>
            <input type="text" id="filter-priority" placeholder="Priority (e.g. HIGH)" />
            <input type="text" id="filter-labels" placeholder="Labels" />
            <button id="filter-btn">Filter</button>
        </div>

        <div class="controls">
            <div class="controls-header">CREATE_TASK</div>
            <div class="form-group">
                <input type="text" id="new-task-title" placeholder="Task Title" />
                <input type="text" id="new-task-priority" placeholder="Priority (e.g. HIGH)" />
                <input type="text" id="new-task-labels" placeholder="Labels (comma separated)" />
            </div>
            <textarea id="new-task-desc" placeholder="Task Description" rows="2"></textarea>
            <button id="add-btn">Submit Task</button>
        </div>

        <div class="board">
            <div class="column" id="col-backlog">
                <div class="column-header">BACKLOG</div>
                <div id="tasks-backlog"></div>
            </div>
            <div class="column" id="col-ready">
                <div class="column-header">READY</div>
                <div id="tasks-ready"></div>
            </div>
            <div class="column" id="col-inprogress">
                <div class="column-header">IN_PROGRESS</div>
                <div id="tasks-inprogress"></div>
            </div>
            <div class="column" id="col-blocked">
                <div class="column-header">BLOCKED</div>
                <div id="tasks-blocked"></div>
            </div>
            <div class="column" id="col-done">
                <div class="column-header">DONE</div>
                <div id="tasks-done"></div>
            </div>
        </div>

        <div class="activity-drawer" id="activity-drawer">
            <h3>Activity History</h3>
            <div id="activity-list"></div>
        </div>

        <footer>
            <span><span class="status-dot"></span>STATUS: ACTIVE &mdash; HOWLBOARD://APP</span>
            <button id="activity-btn" style="margin-left:auto;">Toggle Activity</button>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
