name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  HOWL_FORBID_LOCAL_INFERENCE: "1"

jobs:
  validate:
    name: Build, Contract Tests, Docs & SEO Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build HowlFrame Binary
        run: |
          git clone https://github.com/howlcipher/howlframe.git /tmp/howlframe
          git -C /tmp/howlframe checkout --detach a154ddac2cddb20c75965ba5d5e9dfefcc6ad2ac
          cd /tmp/howlframe
          go build -o $GITHUB_WORKSPACE/howlframe_bin howlframe.go
          chmod +x $GITHUB_WORKSPACE/howlframe_bin

      - name: Run Backend Contract Tests
        run: |
          make test

      - name: Verify Ledger Import Tool Runs
        run: |
          head -n 500 data/fixtures/ledger_sample.jsonl > /tmp/slice.jsonl
          make import LEDGER=/tmp/slice.jsonl MAX=500

      - name: Verify Documentation Matches Implementation
        run: |
          python3 scripts/test_docs.py

      - name: Verify SEO Metadata & Artifacts
        run: |
          python3 scripts/test_seo.py


      - name: Verify Audit Timeline Layout
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 scripts/test_timeline_layout.py
